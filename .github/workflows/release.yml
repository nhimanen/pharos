name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-hcl2 (Terraform indexing tests)
        run: pip install python-hcl2

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Check tag matches pom version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          POM_VERSION="$(mvn -B -N help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [ "v$POM_VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pom.xml version $POM_VERSION"
            exit 1
          fi

      # Validates the CHANGELOG section (incl. its **Index format:** line) before the long build.
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release-notes.sh "${TAG#v}" > notes.md

      - name: Build and test
        run: mvn -B clean package

      - name: Test setup.sh release mode
        run: bash scripts/test-setup.sh

      - name: Build release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          (cd target && sha256sum "pharos-$VERSION.jar" > "pharos-$VERSION.jar.sha256")
          tar czf pharos-skill.tar.gz -C .claude/skills pharos

      - name: Create GitHub release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          gh release create "$TAG" --title "$TAG" --notes-file notes.md \
            "target/pharos-$VERSION.jar" \
            "target/pharos-$VERSION.jar.sha256" \
            pharos-skill.tar.gz \
            pharos \
            setup.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image version
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push the pharos image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pharos/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.ver.outputs.owner }}/pharos:${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push the pharos-operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/operator/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.ver.outputs.owner }}/pharos-operator:${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
