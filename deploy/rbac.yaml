# RBAC for the pharos operator, least privilege:
#   - a namespaced Role: the operator only touches objects in its own namespace (it watches
#     PharosClusters there and creates the cluster's workloads, storage and Jobs next to them);
#   - a ClusterRole that can only read its own CRD (the startup check that the CRD is installed and
#     matches the operator's model). It cannot list, create or change any CRD.
# Apply after the CRD:  kubectl apply -f deploy/crd/ -f deploy/rbac.yaml -f deploy/operator.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: pharos
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pharos-operator
  namespace: pharos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pharos-operator
  namespace: pharos
rules:
  # The custom resource. .status is written only by the operator.
  - apiGroups: ["pharos.dev"]
    resources: ["pharosclusters"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["pharos.dev"]
    resources: ["pharosclusters/status"]
    verbs: ["get", "patch", "update"]
  # Owner references with blockOwnerDeletion on the objects it creates.
  - apiGroups: ["pharos.dev"]
    resources: ["pharosclusters/finalizers"]
    verbs: ["update"]
  # What a PharosCluster consists of: token and MinIO credentials Secrets, rendered config,
  # Services, MinIO PVC.
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pod readiness and the pod IPs/DNS it reads /cluster/status from; never changes pods directly.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Writers and readers (StatefulSets), router and MinIO.
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Bucket creation, project registration/removal and the upgrade pre-flight.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pharos-operator
  namespace: pharos
subjects:
  - kind: ServiceAccount
    name: pharos-operator
    namespace: pharos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pharos-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pharos-operator-crd
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["pharosclusters.pharos.dev"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pharos-operator-crd
subjects:
  - kind: ServiceAccount
    name: pharos-operator
    namespace: pharos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pharos-operator-crd
